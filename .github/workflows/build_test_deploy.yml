name: Build Test and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install npm dependencies
      run: npm install

    - name: Manualy change the config file
      run: echo "export const settings = { host:'http://localhost:3030' };" > src/config.js
      
    - name: Start BE
      run: npm run server-be &

    - name: Wait for be
      run: sleep 3    

    - name: Start FE
      run: npm run start-fe &

    - name: Wait for fe
      run: sleep 3 

    - name: Install system dependencies
      run: |
       sudo apt-get update
       sudo apt-get install -y libasound2t64

    - name: Install Playwright Chromium
      run: node node_modules/playwright/cli.js install chromium
    
    - name: Run tests
      run: node node_modules/@playwright/test/cli.js test

  deploy-be:
    needs: build_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.SERVICE_BE_ID }}
          api_key: ${{ secrets.RENDER_TOKEN }}
          wait_deploy: true

  deploy-fe:
    needs: deploy-be
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.SERVICE_FE_ID }}
          api_key: ${{ secrets.RENDER_TOKEN }}
          wait_deploy: true